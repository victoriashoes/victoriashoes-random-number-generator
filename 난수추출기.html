<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 번호 추출기 - Victoria Shoes Style</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Gothic / Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
        }

        /* 흰색 원형 & 검은색 고딕체 숫자 볼 스타일 */
        .number-ball {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            font-weight: 900;
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 2px solid #111111;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
        }

        .number-ball:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        /* 번호 생성 애니메이션 효과 */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-10deg);
            }
            70% {
                transform: scale(1.15) rotate(3deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 커스텀 버튼 스타일 */
        .btn-black {
            background-color: #000000;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .btn-black:hover {
            background-color: #222222;
            transform: translateY(-1px);
        }
        .btn-black:active {
            transform: translateY(1px);
        }

        /* 스크롤바 감추기 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-8 text-gray-900">

    <!-- 메인 컨테이너 -->
    <div class="w-full max-w-xl mx-auto flex flex-col items-center">
        
        <!-- 최상단 중앙 로고 배치 및 로고 변경 컨트롤 -->
        <header class="w-full text-center my-6 sm:my-8 relative group">
            <!-- 메인 로고 <img> 태그 -->
            <div class="flex justify-center items-center min-h-[60px]">
                <img 
                    id="brandLogo"
                    src="02_배경투명_빅토리아슈즈_로고_흑.png" 
                    alt="Victoria Logo" 
                    class="h-12 sm:h-16 max-w-full object-contain transition-all duration-300"
                    onerror="this.onerror=null; this.src='https://placehold.co/300x80/ffffff/000000?text=VICTORIA';"
                />
            </div>
            
            <p class="text-xs uppercase tracking-widest text-gray-500 mt-3 font-semibold">Random Number Generator</p>

            <!-- 로고 변경 버튼 (상단 우측 배치) -->
            <div class="mt-3 flex justify-center gap-2">
                <label for="logoFileInput" class="cursor-pointer text-[11px] font-semibold text-gray-500 hover:text-black bg-white border border-gray-200 px-2.5 py-1 rounded-full shadow-sm hover:border-black transition-all">
                    📷 로고 이미지 직접 변경
                </label>
                <input type="file" id="logoFileInput" accept="image/*" class="hidden" />
                <button id="resetLogoBtn" class="hidden text-[11px] font-semibold text-gray-400 hover:text-red-500 underline py-1 transition-all">
                    원래 로고로
                </button>
            </div>
        </header>

        <!-- 카드 인터페이스 -->
        <main class="w-full bg-white rounded-3xl p-6 sm:p-10 shadow-xl border border-gray-100 flex flex-col gap-6">
            
            <!-- 입력 폼 섹션 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <!-- 1. 몇 번까지 (최대 범위) -->
                <div class="flex flex-col gap-2">
                    <label for="maxNum" class="text-xs font-bold uppercase tracking-wider text-gray-600 flex items-center gap-1">
                        <span>1. 최대 숫자 범위</span>
                        <span class="text-gray-400 font-normal">(1 ~ N)</span>
                    </label>
                    <div class="relative">
                        <input 
                            type="number" 
                            id="maxNum" 
                            value="45" 
                            min="1" 
                            max="999"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-bold text-lg text-gray-800 transition-all"
                            placeholder="예: 45"
                        />
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm font-medium">까지</span>
                    </div>
                </div>

                <!-- 2. 몇 개를 추출할지 -->
                <div class="flex flex-col gap-2">
                    <label for="countNum" class="text-xs font-bold uppercase tracking-wider text-gray-600 flex items-center gap-1">
                        <span>2. 추출할 개수</span>
                        <span class="text-gray-400 font-normal">(K개)</span>
                    </label>
                    <div class="relative">
                        <input 
                            type="number" 
                            id="countNum" 
                            value="6" 
                            min="1" 
                            max="100"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-bold text-lg text-gray-800 transition-all"
                            placeholder="예: 6"
                        />
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm font-medium">개</span>
                    </div>
                </div>
            </div>

            <!-- 정렬 및 옵션 -->
            <div class="flex items-center justify-between pt-2 border-t border-gray-100 text-sm">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" id="sortOption" checked class="w-4 h-4 accent-black rounded cursor-pointer">
                    <span class="text-gray-600 font-medium text-xs sm:text-sm">오름차순 정렬하여 보기</span>
                </label>
                <button id="resetBtn" class="text-xs text-gray-400 hover:text-gray-700 underline font-medium">
                    초기화
                </button>
            </div>

            <!-- 추출 실행 버튼 -->
            <button 
                id="generateBtn" 
                class="btn-black w-full py-4 rounded-xl font-bold text-base sm:text-lg tracking-wider shadow-lg flex items-center justify-center gap-2"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                번호 추출하기
            </button>

            <!-- 에러/안내 메시지 -->
            <div id="msgBox" class="hidden text-xs text-red-500 font-semibold text-center bg-red-50 py-2.5 px-4 rounded-lg border border-red-100"></div>

            <!-- 결과 출력 구역 -->
            <div class="mt-4 flex flex-col items-center">
                <div class="w-full flex items-center justify-between mb-4">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">추출 결과</span>
                    <button id="copyBtn" class="hidden text-xs font-bold text-black border border-black px-3 py-1 rounded-full hover:bg-black hover:text-white transition-all">
                        결과 복사
                    </button>
                </div>

                <!-- 흰색 원형 & 검은색 고딕체 숫자 볼 배치 영역 -->
                <div 
                    id="resultContainer" 
                    class="w-full min-h-[130px] bg-gray-50 border border-dashed border-gray-200 rounded-2xl p-6 flex flex-wrap items-center justify-center gap-3 sm:gap-4 transition-all"
                >
                    <p id="placeholderText" class="text-gray-400 text-sm font-medium text-center">
                        상단의 설정값을 확인한 후<br><strong class="text-gray-600">[번호 추출하기]</strong> 버튼을 눌러주세요.
                    </p>
                </div>
            </div>

        </main>

        <!-- 히스토리 영역 -->
        <section id="historySection" class="w-full mt-6 hidden">
            <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest">최근 추출 기록</h3>
                    <button id="clearHistoryBtn" class="text-xs text-gray-400 hover:text-gray-600">기록 삭제</button>
                </div>
                <div id="historyList" class="flex flex-col gap-2 max-h-36 overflow-y-auto no-scrollbar text-xs"></div>
            </div>
        </section>

        <!-- 푸터 -->
        <footer class="mt-10 text-center text-xs text-gray-400">
            <p>&copy; VICTORIA. All rights reserved.</p>
        </footer>

    </div>

    <!-- JavaScript 로직 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const brandLogo = document.getElementById('brandLogo');
            const logoFileInput = document.getElementById('logoFileInput');
            const resetLogoBtn = document.getElementById('resetLogoBtn');
            const defaultLogoSrc = "02_배경투명_빅토리아슈즈_로고_흑.png";

            const maxNumInput = document.getElementById('maxNum');
            const countNumInput = document.getElementById('countNum');
            const generateBtn = document.getElementById('generateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const sortOption = document.getElementById('sortOption');
            const resultContainer = document.getElementById('resultContainer');
            const msgBox = document.getElementById('msgBox');
            const copyBtn = document.getElementById('copyBtn');
            const historySection = document.getElementById('historySection');
            const historyList = document.getElementById('historyList');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');

            let lastExtractedNumbers = [];

            // 1. 커스텀 로고 파일 업로드 핸들러
            logoFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        brandLogo.src = evt.target.result;
                        resetLogoBtn.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            });

            // 원래 로고로 복원
            resetLogoBtn.addEventListener('click', () => {
                brandLogo.src = defaultLogoSrc;
                logoFileInput.value = '';
                resetLogoBtn.classList.add('hidden');
            });

            // 메시지 알림 함수
            function showMessage(msg) {
                msgBox.textContent = msg;
                msgBox.classList.remove('hidden');
            }

            function hideMessage() {
                msgBox.classList.add('hidden');
                msgBox.textContent = '';
            }

            // 2. 번호 추출 로직
            function generateNumbers() {
                hideMessage();

                const maxVal = parseInt(maxNumInput.value, 10);
                const countVal = parseInt(countNumInput.value, 10);

                // 유효성 검사
                if (isNaN(maxVal) || maxVal < 1) {
                    showMessage('1 이상의 올바른 최대 숫자를 입력해주세요.');
                    return;
                }
                if (isNaN(countVal) || countVal < 1) {
                    showMessage('1 이상의 올바른 추출 개수를 입력해주세요.');
                    return;
                }
                if (countVal > maxVal) {
                    showMessage(`추출 개수(${countVal}개)는 최대 숫자(${maxVal})보다 클 수 없습니다.`);
                    return;
                }

                // 중복 없이 무작위 추출 (Fisher-Yates 알고리즘)
                const pool = Array.from({ length: maxVal }, (_, i) => i + 1);
                const selected = [];

                for (let i = 0; i < countVal; i++) {
                    const randomIndex = Math.floor(Math.random() * pool.length);
                    selected.push(pool[randomIndex]);
                    pool.splice(randomIndex, 1);
                }

                // 정렬 옵션 처리
                if (sortOption.checked) {
                    selected.sort((a, b) => a - b);
                }

                lastExtractedNumbers = [...selected];

                // 화면 렌더링
                renderNumbers(selected);
                addHistory(selected);
            }

            // 3. 숫자 볼 화면 렌더링 (흰색 원형, 검은 고딕)
            function renderNumbers(numbers) {
                resultContainer.innerHTML = '';
                copyBtn.classList.remove('hidden');

                numbers.forEach((num, index) => {
                    const ball = document.createElement('div');
                    ball.className = 'number-ball animate-pop';
                    ball.textContent = num;
                    
                    // 순차 팝업 애니메이션 지연
                    ball.style.animationDelay = `${index * 0.05}s`;

                    resultContainer.appendChild(ball);
                });
            }

            // 4. 추출 히스토리 기록
            function addHistory(numbers) {
                historySection.classList.remove('hidden');
                
                const timeStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border border-gray-100 font-mono';
                item.innerHTML = `
                    <span class="font-bold text-gray-800">${numbers.join(', ')}</span>
                    <span class="text-[10px] text-gray-400 font-sans">${timeStr}</span>
                `;

                historyList.prepend(item);

                if (historyList.children.length > 5) {
                    historyList.removeChild(historyList.lastChild);
                }
            }

            // 5. 클립보드 복사
            copyBtn.addEventListener('click', () => {
                if (lastExtractedNumbers.length === 0) return;

                const textToCopy = lastExtractedNumbers.join(', ');
                
                const tempInput = document.createElement('textarea');
                tempInput.value = textToCopy;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);

                const originalText = copyBtn.textContent;
                copyBtn.textContent = '복사 완료!';
                copyBtn.classList.add('bg-black', 'text-white');
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.classList.remove('bg-black', 'text-white');
                }, 1500);
            });

            // 초기화
            resetBtn.addEventListener('click', () => {
                maxNumInput.value = 45;
                countNumInput.value = 6;
                sortOption.checked = true;
                hideMessage();
                lastExtractedNumbers = [];
                copyBtn.classList.add('hidden');
                resultContainer.innerHTML = `
                    <p id="placeholderText" class="text-gray-400 text-sm font-medium text-center">
                        상단의 설정값을 확인한 후<br><strong class="text-gray-600">[번호 추출하기]</strong> 버튼을 눌러주세요.
                    </p>
                `;
            });

            clearHistoryBtn.addEventListener('click', () => {
                historyList.innerHTML = '';
                historySection.classList.add('hidden');
            });

            generateBtn.addEventListener('click', generateNumbers);

            [maxNumInput, countNumInput].forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        generateNumbers();
                    }
                });
            });
        });
    </script>
</body>
</html>
